<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta property="og:description" content="中辰第三季活動量衝刺賓果">
  <meta name="description" content="中辰第三季活動量衝刺賓果">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保險衝刺賓果盤</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

    :root {
      --ghibli-green: #486b4f;
      --ghibli-wood: #8f6239;
      --ghibli-paper: #fbf6ea;
      --ghibli-gold: #e5a93c;
      --ghibli-red: #c0392b;
    }

    * {
      box-sizing: border-box;
      font-family: 'Zen Maru Gothic', -apple-system, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 10px;
      min-height: 100vh;
      background: linear-gradient(180deg, #d4e8f0 0%, #a8d5ba 50%, #689f78 100%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: rgba(251, 246, 234, 0.94);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(35, 60, 42, 0.25);
      border: 4px solid var(--ghibli-wood);
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      color: var(--ghibli-green);
      margin: 0 0 5px 0;
      font-size: 2rem;
      font-weight: 900;
      text-shadow: 1px 1px 0px #fff;
    }

    p.subtitle {
      color: #5c4f43;
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .stats-bar {
      display: flex;
      justify-content: space-around;
      background: #e1edd8;
      border: 2px dashed var(--ghibli-green);
      padding: 10px;
      border-radius: 14px;
      font-weight: 700;
      color: var(--ghibli-green);
      margin-bottom: 15px;
    }

    .bingo-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .cell {
      background: var(--ghibli-paper);
      border: 2.5px solid #d1c4b2;
      border-radius: 12px;
      padding: 6px 4px;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      user-select: none;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }

    .cell:hover {
      transform: translateY(-3px) scale(1.02);
      border-color: var(--ghibli-wood);
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .cell-num {
      font-size: 0.72rem;
      font-weight: 900;
      color: var(--ghibli-wood);
      opacity: 0.65;
      margin-bottom: 3px;
      text-align: center;
      width: 100%;
    }

    .cell-text {
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.3;
      color: #3d332a;
      width: 100%;
      text-align: center;
      outline: none;
      padding: 2px;
      border-radius: 4px;
      cursor: text;
    }

    .cell-text:focus {
      background: #ffffff;
      box-shadow: 0 0 0 2px var(--ghibli-gold);
    }

    .cell.completed {
      background-color: #fff2d6;
      border-color: var(--ghibli-gold);
    }

    .cell.completed::after {
      content: "✓ 達成";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-12deg);
      background: var(--ghibli-red);
      color: white;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 900;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      pointer-events: none;
      border: 2px solid #ffffff;
    }

    .cell.center-cell {
      border-color: var(--ghibli-gold);
      background: #fffdf5;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .btn-reset {
      background: #e74c3c;
      color: white;
    }

    .btn-save {
      background: var(--ghibli-green);
      color: white;
    }

    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    @media (max-width: 500px) {
      .cell {
        min-height: 78px;
        padding: 4px 2px;
      }
      .cell-text {
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>🍃 保險衝刺賓果盤</h1>
  </header>

  <div class="stats-bar">
    <div>已完成：<span id="completed-count">0</span> / 25</div>
    <div>當前連線：<span id="bingo-lines">0</span> 條</div>
  </div>

  <div class="bingo-grid" id="grid"></div>

  <div class="btn-group">
    <button class="btn btn-save" onclick="saveCustomGoals()">💾 儲存自訂文字</button>
    <button class="btn btn-reset" onclick="resetBoard()">↺ 重置進度與文字</button>
  </div>
</div>

<script>
  const defaultGoals = [
    "約訪 10位\n男性客戶",
    "定聯10位\n生日 / 節日祝賀",
    "發布10篇\n社群工作文\n含限動",
    "談10件\n醫療或重傷",
    "新增5位\n產險新客\n（已成交）",

    "🌟 成交 1筆大單\n(20C以上)",
    "完成 3份\n保單健診報告",
    "成交30件產險\n（含續保）",
    "寄/送10份\n理賠申請或\n關懷",
    "談3件\n儲蓄/美元/\n分紅",

    "為 5位舊客戶\n做週年度保檢",
    "獲得 10位\n客戶轉介紹\n新名單",
    "一起唱\n富邦\n增員群新會",
    "拜訪10位 VIP\n共進咖啡或吃飯",
    "約訪 3位\n屆退族群(55歲+)",

    "談5件\n意外險",
    "送 10張\n手寫卡或小禮",
    "今日出席\n20位組員",
    "完成 1個家庭\n總保障整理",
    "約訪 3位\n新手爸媽/準父母",

    "約訪 20位\n女性客戶",
    "上月全勤2位\n(活動參與率\n100%)",
    "收集 3份\n完整需求分析問\n卷",
    "獲得 3位新客戶\n保單/保險存摺",
    "每人現在\n立即傳5位\n男癌女癌影片"
  ];

  let goals = JSON.parse(localStorage.getItem('customBingoGoals_v3')) || defaultGoals;
  let state = JSON.parse(localStorage.getItem('bingoState_v3')) || new Array(25).fill(false);

  function createGrid() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    goals.forEach((goal, index) => {
      const cell = document.createElement('div');
      cell.className = `cell ${state[index] ? 'completed' : ''} ${index === 12 ? 'center-cell' : ''}`;
      
      const num = document.createElement('div');
      num.className = 'cell-num';
      num.textContent = String(index + 1).padStart(2, '0');
      
      const text = document.createElement('div');
      text.className = 'cell-text';
      text.contentEditable = true;
      text.innerText = goal;

      text.addEventListener('click', (e) => e.stopPropagation());
      cell.addEventListener('click', () => toggleCell(index));

      cell.appendChild(num);
      cell.appendChild(text);
      grid.appendChild(cell);
    });
    updateStats();
  }

  function toggleCell(index) {
    state[index] = !state[index];
    localStorage.setItem('bingoState_v3', JSON.stringify(state));
    createGrid();
  }

  function saveCustomGoals() {
    const textElements = document.querySelectorAll('.cell-text');
    textElements.forEach((el, i) => {
      goals[i] = el.innerText;
    });
    localStorage.setItem('customBingoGoals_v3', JSON.stringify(goals));
    alert('已成功儲存自訂文字！');
  }

  function updateStats() {
    const completedCount = state.filter(Boolean).length;
    document.getElementById('completed-count').textContent = completedCount;

    let lines = 0;
    for (let i = 0; i < 5; i++) {
      if (state.slice(i * 5, i * 5 + 5).every(Boolean)) lines++;
    }
    for (let i = 0; i < 5; i++) {
      if ([0,1,2,3,4].map(r => state[r * 5 + i]).every(Boolean)) lines++;
    }
    if ([0, 6, 12, 18, 24].map(i => state[i]).every(Boolean)) lines++;
    if ([4, 8, 12, 16, 20].map(i => state[i]).every(Boolean)) lines++;

    document.getElementById('bingo-lines').textContent = lines;
  }

  function resetBoard() {
    if (confirm("確定要重置所有點擊進度與自訂文字嗎？")) {
      state = new Array(25).fill(false);
      goals = [...defaultGoals];
      localStorage.removeItem('bingoState_v3');
      localStorage.removeItem('customBingoGoals_v3');
      createGrid();
    }
  }

  createGrid();
</script>

</body>
</html>
